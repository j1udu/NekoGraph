[project]
name = "nekograph"
version = "0.1.0"
description = "A LangGraph-native QQ Agent Framework powered by NapCat and OneBot v11."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiosqlite>=0.22,<1",
  "apscheduler>=3.11,<4",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "langchain-core>=1.5,<2",
  "langgraph==1.2.11",
  "langgraph-checkpoint-sqlite==3.1.1",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.12,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.34,<1",
  "websockets>=15,<17",
]

[project.optional-dependencies]
rag = [
  "faiss-cpu>=1.9,<2",
  "numpy>=2,<3",
]

[dependency-groups]
dev = [
  "pyright>=1.1.408,<2",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=7,<8",
  "ruff>=0.15,<0.16",
]

[project.scripts]
nekograph = "nekograph.__main__:main"

[build-system]
requires = ["hatchling>=1.29,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nekograph"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
